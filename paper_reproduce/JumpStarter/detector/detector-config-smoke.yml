sample_score_method:
  lesinn:
    phi: 10
    t: 5
  moving_average:
    window: 20
    stride: 5
anomaly_scoring:
  anomaly_score_example:
    percentage: 90
    topn: 2
global:
  random_state: 42
data:
  path: '../data/data/service1.csv'
  label_path: '../data/label/service1.csv'
  save_path: './result_smoke'
  row_begin: 0
  row_end: 180
  col_begin: 0
  col_end: 5
  rec_windows_per_cycle: 3
  header: null
  reconstruct:
    window: 20
    stride: 20
  detect:
    window: 10
    stride: 5
detector_arguments:
  workers: 1
  anomaly_scoring: 'anomaly_score_example'
  sample_score_method: 'moving_average_score'
  cluster_threshold: 0.01
  sample_rate: 0.6
  latest_windows: 20
  scale: 5
  rho: 0.1
  sigma: 0.5
  retry_limit: 10
  without_grouping: one_by_one
  without_localize_sampling: true
