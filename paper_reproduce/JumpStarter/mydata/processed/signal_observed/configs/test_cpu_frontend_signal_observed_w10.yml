sample_score_method:
  lesinn:
    phi: 10
    t: 5
  moving_average:
    window: 5
    stride: 1
anomaly_scoring:
  anomaly_score_example:
    percentage: 90
    topn: 2
global:
  random_state: 42
data:
  path: '../mydata/processed/signal_observed/data/test_cpu_frontend_signal_observed.csv'
  label_path: '../mydata/processed/signal_observed/label/test_cpu_frontend_signal_observed.csv'
  save_path: '../mydata/processed/signal_observed/result/test_cpu_frontend_signal_observed_w10'
  row_begin: 0
  row_end: 160
  col_begin: 0
  col_end: 44
  rec_windows_per_cycle: 3
  header: null
  reconstruct:
    window: 10
    stride: 10
  detect:
    window: 5
    stride: 1
detector_arguments:
  workers: 1
  anomaly_scoring: 'anomaly_score_example'
  sample_score_method: 'moving_average_score'
  cluster_threshold: 0.01
  sample_rate: 0.5
  latest_windows: 20
  scale: 5
  rho: 0.1
  sigma: 0.5
  retry_limit: 20
  without_grouping: one_by_one
  without_localize_sampling: true
