sample_score_method:
  lesinn:
    phi: 10
    t: 5
  moving_average:
    window: 20
    stride: 5
anomaly_scoring:
  anomaly_score_example:
    percentage: 90
    topn: 2
global:
  random_state: 42
data:
  path: '../mydata/processed/full_log_based/data/test_all.csv'
  label_path: '../mydata/processed/full_log_based/label/test_all.csv'
  save_path: '../mydata/processed/full_log_based/result/test_all'
  row_begin: 0
  row_end: 420
  col_begin: 0
  col_end: 55
  rec_windows_per_cycle: 3
  header: null
  reconstruct:
    window: 40
    stride: 40
  detect:
    window: 20
    stride: 5
detector_arguments:
  workers: 1
  anomaly_scoring: 'anomaly_score_example'
  sample_score_method: 'moving_average_score'
  cluster_threshold: 0.01
  sample_rate: 0.6
  latest_windows: 20
  scale: 5
  rho: 0.1
  sigma: 0.5
  retry_limit: 20
  without_grouping: one_by_one
  without_localize_sampling: true
