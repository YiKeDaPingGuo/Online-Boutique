project_name: AIOps Agent for Online Boutique
window_minutes: 10
top_k: 3

services:
  - frontend
  - productcatalogservice
  - recommendationservice
  - cartservice
  - checkoutservice
  - paymentservice
  - shippingservice
  - currencyservice
  - emailservice
  - adservice

datasource:
  type: prometheus

prometheus:
  base_url: http://prometheus:9090
  query_step_seconds: 30
  timeout_seconds: 10
  metric_mapping_file: config/metric_mapping.yaml

kubernetes:
  namespace: default

chaosmesh:
  namespace: chaos-mesh
  experiment_namespace: default
  known_experiments:
    recommendationservice: recommendation-delay
    cartservice: cart-cpu-stress

llm:
  enabled: true
  provider: volcengine-ark
  base_url: https://ark.cn-beijing.volces.com/api/v3
  api_key_env: ARK_API_KEY
  model: ep-20260528104127-tn2f7
  temperature: 0.2

detector:
  type: rule
  thresholds:
    cpu_usage: 0.8
    memory_usage: 0.8
    request_latency_p95: 500
    error_rate: 0.05
    pod_ready: 0.5

remediation:
  mode: dry-run
  require_confirm: true
  allow_execute_without_confirm: false

output:
  dir: /tmp/aiopsagent
